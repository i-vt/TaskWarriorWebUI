<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskWarrior - {{ title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0c; --surface:#111116; --border:#2a2a35;
    --text:#e2e2f0; --text-dim:#7070a0; --accent:#f0c040; --radius:4px;
    --mono:'JetBrains Mono', monospace; --display:'Syne', sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px;
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px); }
  .card { width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px; display:flex; flex-direction:column; gap:16px; }
  .logo { font-family:var(--display); font-size:22px; font-weight:800; color:var(--accent);
    letter-spacing:-0.5px; text-align:center; user-select:none; }
  .logo span { color:var(--text-dim); font-weight:700; }
  h1 { font-family:var(--display); font-size:16px; color:var(--text); text-align:center; font-weight:700; }
  .msg { color:var(--text-dim); font-size:12px; line-height:1.7; text-align:center; }
  a.btn { display:block; text-align:center; background:var(--accent); border:none; border-radius:var(--radius);
    color:#0a0a0c; font-family:var(--mono); font-size:13px; font-weight:700; padding:12px;
    cursor:pointer; text-decoration:none; transition:background .15s; }
  a.btn:hover { background:#ffd050; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">TASK<span>WARRIOR</span></div>
    <h1>{{ title }}</h1>
    <div class="msg">{{ message }}</div>
    <a class="btn" href="{{ url_for('login') }}">Sign in</a>
  </main>
</body>
</html>
