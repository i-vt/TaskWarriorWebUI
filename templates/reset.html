<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskWarrior - Reset password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0a0a0c; --surface:#111116; --surface2:#18181f; --border:#2a2a35;
    --text:#e2e2f0; --text-dim:#7070a0; --text-muted:#3a3a55; --accent:#f0c040; --accent-dim:#a07a10;
    --red:#e05050; --radius:4px;
    --mono:'JetBrains Mono', monospace; --display:'Syne', sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:var(--mono); font-size:13px;
    min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px; }
  body::before { content:''; position:fixed; inset:0; pointer-events:none; z-index:9999;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px); }
  .card { width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:32px 28px; display:flex; flex-direction:column; gap:18px; }
  .logo { font-family:var(--display); font-size:24px; font-weight:800; color:var(--accent);
    letter-spacing:-0.5px; text-align:center; user-select:none; }
  .logo span { color:var(--text-dim); font-weight:700; }
  .tagline { text-align:center; color:var(--text-dim); font-size:11.5px; margin-top:-10px; }
  .field-label { font-size:10px; font-weight:600; letter-spacing:0.15em; color:var(--text-muted);
    text-transform:uppercase; margin-bottom:6px; display:block; }
  .key-input { width:100%; background:var(--surface2); border:1px solid var(--border); border-radius:var(--radius);
    color:var(--text); font-family:var(--mono); font-size:14px; padding:11px 12px; outline:none;
    transition:border-color .15s; margin-bottom:14px; }
  .key-input:focus { border-color:var(--accent-dim); }
  .key-input::placeholder { color:var(--text-muted); }
  .submit-btn { width:100%; background:var(--accent); border:none; border-radius:var(--radius); color:#0a0a0c;
    font-family:var(--mono); font-size:13px; font-weight:700; padding:12px; cursor:pointer; transition:background .15s; }
  .submit-btn:hover { background:#ffd050; }
  .error { display:{% if error %}block{% else %}none{% endif %}; background:#2a1214; border:1px solid var(--red);
    color:var(--red); border-radius:var(--radius); font-size:12px; padding:9px 12px; text-align:center; }
  @media (max-width:480px) { body { padding:12px; align-items:flex-start; padding-top:15vh; } .card { padding:24px 18px; } }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">TASK<span>WARRIOR</span></div>
    <div class="tagline">choose a new password</div>

    <div class="error" role="alert">{{ error or "" }}</div>

    <form method="post" autocomplete="off">
      <label class="field-label" for="password">New password (min 6 chars)</label>
      <input class="key-input" type="password" id="password" name="password" autofocus required>
      <label class="field-label" for="confirm">Confirm new password</label>
      <input class="key-input" type="password" id="confirm" name="confirm" required>
      <div style="height:14px"></div>
      <button class="submit-btn" type="submit">Update password</button>
    </form>
  </main>
</body>
</html>
